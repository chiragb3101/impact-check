[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-cli"
version = "0.1.0"
description = "Change impact analysis for monorepos: changed symbols, callers, targeted tests, risk signals, HTML reports"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.6",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.scripts]
impact = "impact.cli:main"

[tool.setuptools.packages.find]
include = ["impact*"]

[tool.setuptools.package-data]
impact = ["schema/*.json", "templates/*.j2"]
